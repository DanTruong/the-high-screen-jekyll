layout: null
---
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: "The High Screen" }}</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/ths.css' | relative_url }}">
</head>

<body>
    <header class="site-header">
        <a href="{{ '/' | relative_url }}" class="site-title-link">
            <h1 class="site-title">The High Screen</h1>
        </a>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark site-navbar">
        <div class="container">
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/?category=the-buckets-blog' | relative_url }}">
                            The Buckets Blog
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/?category=show-dont-tell' | relative_url }}">
                            Show Don't Tell
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/?category=all' | relative_url }}">
                            Archive
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/about/' | relative_url }}">
                            About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {{ content }}

    <!-- Bootstrap 5.3.8 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React without JSX or a build step. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- The High Screen application code -->
    <script src="{{ '/assets/js/ths.js' | relative_url }}"></script>
</body>
</html>
